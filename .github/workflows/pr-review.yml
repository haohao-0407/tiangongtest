name: AI PR Review

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number (leave empty for API smoke check)'
        required: false
        type: string

permissions:
  contents: read

# Let a running session clean up normally. Later runs re-read the current PR head.
concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number || 'smoke' }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Secrets must never be used with a checkout of a PR's head or merge commit.
      - name: Checkout trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked reviewer dependencies
        working-directory: tools/pr-review
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify reviewer behavior
        working-directory: tools/pr-review
        run: npm test
      - name: Review PR or check API access
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-6-astra' }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Set the repository Actions secret OPENAI_API_KEY before running AI PR Review.'
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            node tools/pr-review/review.mjs --output tools/pr-review/output/review.md
          else
            node tools/pr-review/review.mjs --smoke
          fi
